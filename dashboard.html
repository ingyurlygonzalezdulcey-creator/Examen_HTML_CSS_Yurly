<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progreso Del CLiente</title>

    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/animations.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1>EcoMarcket</h1>
            <p>Progreso de nuestros Clientes</p>
        </div>
    </header>

    <main class="container">
        <section class="progreso-cliente">
            <img src="../img/testimonials/cliente-ana.jpg" alt="Retrato ilustrativo de una clienta"
                            loading="lazy">
                        <div class="stars" aria-label="5 de 5 estrellas">★★★★★</div>
                        <strong>— Jane Doe </strong>
                    
                   <fieldset class="filter-group">
                    <legend>Trees Planted</legend>
                    <label for="price-range">12/20</label>
                    <input class="range-control" type="range" id="price-range" min="0" max="20" step="1"
                        value="20">
                    </fieldset>

                    <fieldset class="filter-group">
                    <legend>CO2, Saved</legend>
                    <label for="price-range">450 Kg</label>
                    <input class="range-control" type="range" id="price-range" min="0" max="20" step="1"
                        value="20">
                    </fieldset>

                    <fieldset class="filter-group">
                    <legend>Water Saved</legend>
                    <label for="price-range">2.450 L</label>
                    <input class="range-control" type="range" id="price-range" min="0" max="20" step="1"
                        value="20">
                    </fieldset>

                    <fieldset class="filter-group">
                    <legend>Waste Diverted</legend>
                    <label for="price-range">85 Kg</label>
                    <input class="range-control" type="range" id="price-range" min="0" max="20" step="1"
                        value="20">
                    </fieldset>

                    <fieldset class="filter-group">
                    <legend>Eco-Points</legend>
                    <label for="price-range">1.250</label>
                    <input class="range-control" type="range" id="price-range" min="0" max="20" step="1"
                        value="20">
                    </fieldset>

                
            </section>

    </main>

</body>

</html>
